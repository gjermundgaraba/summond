name: Summond
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Automatic
packages:
  SummondCore:
    path: Core
targets:
  Summond:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/**
          - Info.plist
      - path: Resources/AppIcon.icns
    dependencies:
      - package: SummondCore
        product: SummondCore
      - target: SummondAgent
        embed: false
      - target: SummondStatus
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.garaba.summond
        INFOPLIST_FILE: App/Info.plist
    postBuildScripts:
      - name: Embed Agent and Login Item
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/SummondAgent.app/Contents/MacOS/SummondAgent
          - $(PROJECT_DIR)/App/Resources/net.garaba.summond.agent.plist
          - $(PROJECT_DIR)/scripts/apply-launch-agent-spawn-constraint.sh
          - $(BUILT_PRODUCTS_DIR)/SummondStatus.app/Contents/MacOS/SummondStatus
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/SummondAgent.app
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/net.garaba.summond.agent.plist
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LoginItems/SummondStatus.app
        script: |
          set -euo pipefail

          app_contents="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          macos="$app_contents/MacOS"
          launch_agents="$app_contents/Library/LaunchAgents"
          login_items="$app_contents/Library/LoginItems"

          mkdir -p "$macos" "$launch_agents" "$login_items"

          # The agent lives in Contents/MacOS (a standard code location) so the
          # outer app signs it as nested code with its own cdhash, rather than
          # sealing it as a flat resource tree (which Contents/Resources does).
          rm -rf "$macos/SummondAgent.app"
          cp -R "$BUILT_PRODUCTS_DIR/SummondAgent.app" "$macos/SummondAgent.app"

          agent_plist="$launch_agents/net.garaba.summond.agent.plist"
          cp "$PROJECT_DIR/App/Resources/net.garaba.summond.agent.plist" "$agent_plist"
          bash "$PROJECT_DIR/scripts/apply-launch-agent-spawn-constraint.sh" \
            "$agent_plist" \
            "${DEVELOPMENT_TEAM:-}"

          rm -rf "$login_items/SummondStatus.app"
          cp -R "$BUILT_PRODUCTS_DIR/SummondStatus.app" "$login_items/SummondStatus.app"
  SummondAgent:
    type: application
    platform: macOS
    sources:
      - path: Agent
        excludes:
          - Info.plist
      - path: Resources/AppIcon.icns
    dependencies:
      - package: SummondCore
        product: SummondCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.garaba.summond.agent
        INFOPLIST_FILE: Agent/Info.plist
  SummondStatus:
    type: application
    platform: macOS
    sources:
      - path: Status
        excludes:
          - Info.plist
      - path: Resources/AppIcon.icns
    dependencies:
      - package: SummondCore
        product: SummondCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.garaba.summond.ui
        INFOPLIST_FILE: Status/Info.plist
  SummondTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: Summond
      - package: SummondCore
        product: SummondCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.garaba.summond.tests
        GENERATE_INFOPLIST_FILE: YES
  SummondUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Summond
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.garaba.summond.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Summond:
    build:
      targets:
        Summond: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SummondTests
    profile:
      config: Release
    archive:
      config: Release
  SummondUITests:
    build:
      targets:
        Summond: all
        SummondUITests: [test]
    test:
      config: Debug
      targets:
        - name: SummondUITests
          parallelizable: false

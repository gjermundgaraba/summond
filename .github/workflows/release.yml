name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release
    env:
      NOTARY_PROFILE: summond-ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Read version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]] || {
            echo "Tag must be v followed by one to three numeric components." >&2
            exit 1
          }
          echo "MARKETING_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Configure signing and notarization
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          signing_keychain="$RUNNER_TEMP/summond-signing.keychain-db"
          echo "SIGNING_KEYCHAIN=$signing_keychain" >> "$GITHUB_ENV"

          : "${APPLE_API_ISSUER_ID:?Missing release secret APPLE_API_ISSUER_ID}"
          : "${APPLE_API_KEY_ID:?Missing release secret APPLE_API_KEY_ID}"
          : "${APPLE_API_KEY_P8_BASE64:?Missing release secret APPLE_API_KEY_P8_BASE64}"
          : "${DEVELOPER_ID_P12_BASE64:?Missing release secret DEVELOPER_ID_P12_BASE64}"
          : "${DEVELOPER_ID_P12_PASSWORD:?Missing release secret DEVELOPER_ID_P12_PASSWORD}"

          keychain_password="$(openssl rand -hex 32)"
          p12_path="$RUNNER_TEMP/developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$p12_path"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"

          security create-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security import "$p12_path" \
            -k "$signing_keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$signing_keychain"
          security default-keychain -d user -s "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain"
          security find-identity -p codesigning -v "$signing_keychain"

          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --keychain "$signing_keychain"

      - name: Build signed and notarized release
        env:
          SIGNING_IDENTITY: Developer ID Application
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: make release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 \
            dist/release/Summond.dmg \
            dist/release/Summond.zip \
            > dist/release/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            dist/release/Summond.dmg \
            dist/release/Summond.zip \
            dist/release/SHA256SUMS \
            --verify-tag \
            --title "Summond $MARKETING_VERSION" \
            --generate-notes

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/AuthKey.p8"
